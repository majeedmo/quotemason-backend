[project]
name = "quotemason-backend"
version = "0.1.0"
description = "QuoteMason (agentic estimation assistant) — backend (LangGraph agent + RAG ingestion/retrieval)"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-qdrant>=0.2",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "pydantic-settings>=2.5",
    "python-frontmatter>=1.1",
    "langgraph>=1.2.9",
    "tavily-python>=0.7.26",
    "langgraph-checkpoint-redis>=0.5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
# Offline eval tooling (RAGAS SDG + metrics) — not needed by the deployed API.
evals = [
    "ragas>=0.4.3",
    # ragas imports langchain_community.chat_models.vertexai, which 0.4.x removed
    "langchain-community>=0.3.31,<0.4",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
